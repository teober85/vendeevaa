<VirtualHost *:443>
    ServerName vendeevaa.sablevents.fr

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/vendeevaa.sablevents.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vendeevaa.sablevents.fr/privkey.pem

    ProxyPreserveHost On

    # WebSocket (wss://vendeevaa.sablevents.fr/ws → ws://localhost:8766)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade  [NC]
    RewriteRule ^/ws$  ws://localhost:8766/  [P,L]

    # HTTP → port 8765
    ProxyPass        /ws  ws://localhost:8766/
    ProxyPassReverse /ws  ws://localhost:8766/

    ProxyPass        /    http://localhost:8765/
    ProxyPassReverse /    http://localhost:8765/
</VirtualHost>
